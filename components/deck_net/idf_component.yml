dependencies:
  idf: ">=5.4"
  # Tab5: matched to the ESP-Hosted slave firmware M5Stack ships on the Tab5's
  # ESP32-C6 (ESP32C6-WiFi-SDIO-Interface v1.4.1), same pairing as M5's own
  # Tab5 firmware, so the C6 never needs reflashing.
  # The T-Display P4 pulls its own (newer) pair from boards/tdisplay_p4.
  espressif/esp_hosted:
    version: "1.4.0"
    rules:
      - if: "$CONFIG{DECK_BOARD_TAB5} == True"
  espressif/esp_wifi_remote:
    version: "0.8.5"
    rules:
      - if: "$CONFIG{DECK_BOARD_TAB5} == True"
